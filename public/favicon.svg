<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <linearGradient id="yd-grad" x1="4" y1="4" x2="28" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5e6ad2" />
      <stop offset="100%" stop-color="#828fff" />
    </linearGradient>
    <linearGradient id="yd-bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#121316" />
      <stop offset="100%" stop-color="#050506" />
    </linearGradient>
  </defs>

  <!-- Precision Container -->
  <rect width="32" height="32" rx="8" fill="url(#yd-bg)" />
  <rect x="0.5" y="0.5" width="31" height="31" rx="7.5" stroke="#23252a" stroke-width="1" />

  <!-- Outer Orbital "Year" Ring -->
  <circle cx="16" cy="16" r="10.5" stroke="#282a30" stroke-width="1.2" stroke-dasharray="2 2" />
  <path d="M16 5.5 A10.5 10.5 0 1 1 5.5 16" stroke="url(#yd-grad)" stroke-width="2" stroke-linecap="round" />

  <!-- Geometric "Y" & "D" Chrono Monogram -->
  <!-- Left arm of Y -->
  <path d="M10.5 10.5 L16 16" stroke="#f7f8f8" stroke-width="2" stroke-linecap="round" />
  <!-- Right arm of Y arching towards D -->
  <path d="M21.5 10.5 L16 16" stroke="url(#yd-grad)" stroke-width="2" stroke-linecap="round" />
  <!-- Stem of Y -->
  <path d="M16 16 L16 22.5" stroke="#f7f8f8" stroke-width="2" stroke-linecap="round" />

  <!-- Center Solar Day Node -->
  <circle cx="16" cy="16" r="2.5" fill="url(#yd-grad)" />
  <circle cx="16" cy="16" r="1.2" fill="#ffffff" />

  <!-- Precision Solar Pip at Zenith (Day 1 / Vernal Equinox) -->
  <circle cx="16" cy="5.5" r="1.5" fill="#828fff" />
</svg>
