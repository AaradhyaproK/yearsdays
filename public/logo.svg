    <circle cx="16" cy="16" r="10" stroke="#34343a" stroke-width="1.25" stroke-dasharray="3 2" />
    <path d="M16 6 A10 10 0 1 1 6 16" stroke="#5e6ad2" stroke-width="2" stroke-linecap="round" />
